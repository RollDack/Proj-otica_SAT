{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <h2>Ajuste Manual de Estoque</h2>
  <form method="POST" action="{{ url_for('stock.adjust_stock') }}">
    <div class="mb-3">
      <label for="product_id">Produto</label>
      <select class="form-control" id="product_id" name="product_id" required>
        {% for product in products %}
        <option value="{{ product.id }}">{{ product.name }} (Atual: {{ product.stock }})</option>
        {% endfor %}
      </select>
    </div>

    <div class="mb-3">
      <label for="action">Tipo de Ação</label>
      <select class="form-control" id="action" name="action" required>
        <option value="entrada">Entrada</option>
        <option value="saida">Saída</option>
        <option value="ajuste">Ajuste</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="quantity">Quantidade</label>
      <input type="number" class="form-control" id="quantity" name="quantity" required min="1">
    </div>

    <div class="mb-3">
      <label for="note">Observação</label>
      <input type="text" class="form-control" id="note" name="note">
    </div>

    <button type="submit" class="btn btn-primary">Registrar</button>
    <a href="{{ url_for('stock.stock_history') }}" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
{% endblock %}
