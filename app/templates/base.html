<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optical Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <header>
        <h1>Loja de Ótica</h1>
        <a href="{{ url_for('customers.register_customer') }}" class="add-button">Cadastre-se</a>
        <a href="{{ url_for('appointments.list_appointments') }}" class="btn-outline-light">Minhas Consultas</a>
        <nav>
            <a href="/">Home</a>
            <a href="/customers">Clientes</a>
            <a href="/catalog">Catálogo</a>
            <a href="/products">Produtos</a>
            <a href="/employee">Funcionários</a>
            <a href="/sales">Vendas</a>
            <a href="/cart">Ver Carrinho</a>
            <a href="/stock">Estoque</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
