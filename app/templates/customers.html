{% extends "base.html" %}

{% block content %}



<h2>Lista de Clientes Cadastrados</h2>

<table>
    <thead>
        <tr>
            <th>Nome</th>
            <th>Email</th>
            <th>Telefone</th>
            <th>Data de Nascimento</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody>
        {% for customer in customers %}
        <tr>
            <td>{{ customer.name }}</td>
            <td>{{ customer.email }}</td>
            <td>{{ customer.phone }}</td>
            <td>{{ customer.birthdate }}</td>
            <td>
                <button onclick="editClient('{{ customer.id }}', '{{ customer.name }}', '{{ customer.email }}', '{{ customer.phone }}', '{{ customer.birthdate }}')">Editar</button>
                <form action="{{ url_for('customers.delete_customer', customer_id=customer.id) }}" method="post" style="display:inline;">
                    <button type="submit">Excluir</button>
                </form>
                
                
                
                
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
    <!-- Formulário de edição fora da tabela -->
<div id="editCustomerFormContainer" style="display: none; margin-top: 20px; padding: 20px; border: 1px solid #ccc; border-radius: 8px; width: 400px; background-color: #f9f9f9;">
    <h3>Editar Cliente</h3>
    <form id="editCustomerForm" method="POST" action="{{ url_for('customers.update_customer') }}">
        <input type="hidden" name="id" id="edit-id">
        <div style="margin-bottom: 10px;">
            <label for="edit-name">Nome:</label><br>
            <input type="text" name="name" id="edit-name" style="width: 100%;">
        </div>
        <div style="margin-bottom: 10px;">
            <label for="edit-email">Email:</label><br>
            <input type="email" name="email" id="edit-email" style="width: 100%;">
        </div>
        <div style="margin-bottom: 10px;">
            <label for="edit-phone">Telefone:</label><br>
            <input type="tel" name="phone" id="edit-phone" style="width: 100%;">
        </div>
        <div style="margin-bottom: 10px;">
            <label for="edit-birthdate">Data de Nascimento:</label><br>
            <input type="date" name="birthdate" id="edit-birthdate" style="width: 100%;">
        </div>
        <button type="submit" style="margin-top: 10px;">Atualizar</button>
    </form>
</div>

<script>
    function editClient(id, name, email, phone, birthdate) {
        document.getElementById("edit-id").value = id;
        document.getElementById("edit-name").value = name;
        document.getElementById("edit-email").value = email;
        document.getElementById("edit-phone").value = phone;
        document.getElementById("edit-birthdate").value = birthdate;
        document.getElementById("editCustomerFormContainer").style.display = "block";
    }
    </script>
    



{% endblock %}
